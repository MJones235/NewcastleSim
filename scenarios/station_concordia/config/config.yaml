# Configuration for Station Concordia simulation

# Simulation parameters
simulation:
  dt: 0.05  # JuPedSim timestep (seconds)
  max_iterations: 3000  # Maximum simulation steps (3000 * 0.05 = 150 seconds)
  decision_interval: 15.0  # Time between Concordia decisions (seconds) - reduced frequency for smoother movement
  spawn_interval: 2.0  # Time between agent spawns (seconds)
  network_path: "scenarios/station_concordia/geometry/monument/network"  # Path to Monument Station geometry

  # Multi-level configuration (Monument Station has 2 levels: concourse and platforms)
  multi_level: true  # Enable multi-level simulation
  levels: ["0", "-1"]  # Level IDs to load (0 = concourse, -1 = platforms)
  level_id: 0  # Default spawn level (used only if multi_level is false)
  # Escalator belt speed in m/s.  Agents on an escalator will never move slower
  # than this relative to the surrounding floor (standard commercial escalator ~0.5 m/s).
  escalator_belt_speed: 0.5

# Agent configuration
agents:
  count: 50

  # Personality distribution (percentage)
  personalities:
    ISTJ: 13.0
    ISFJ: 12.0
    INFJ: 2.0
    INTJ: 3.0
    ISTP: 6.0
    ISFP: 9.0
    INFP: 4.0
    INTP: 3.0
    ESTP: 6.0
    ESFP: 9.0
    ENFP: 8.0
    ENTP: 3.0
    ESTJ: 11.0
    ESFJ: 12.0
    ENFJ: 3.0
    ENTJ: 2.0

  # Risk tolerance distribution
  risk_tolerance:
    low: 30.0
    moderate: 50.0
    high: 20.0

  # Age distribution
  age:
    min: 18
    max: 75

  # Initial zones
  spawn_zones:
    - platform
    - concourse

  # Distribution of static-knowledge profiles for agents
  knowledge_profiles:
    novice: 35.0
    commuter: 65.0

# Event configuration
events:
  #- time: 30.0
  #  message: "This is a test of the emergency announcement system."

  - time: 15.0
    message: "Attention all passengers: Please evacuate the station immediately via the nearest exit."

  #- time: 120.0
  #  message: "Emergency services are on site. Continue evacuating calmly."
# Phase 4.2: Test scenarios for route changing behavior
test_scenarios:
  blocked_exit:
    # Test realistic blocked exit discovery
    enabled: true  # Set to true to run this scenario
    block_time: 30.0  # Block the exit at 30 seconds
    blocked_exit: "jps.entrance_1"  # Which exit to block (jps.entrance_1, jps.entrance_2, or jps.entrance_3)
    description: "Test blocked exit discovery. Entrance 1 blocks at t=30s. Agents discover visually (<20m) or by observing others turning back."

  # Phase 4.1: Help behavior scenario
  help_behavior:
    enabled: true  # Set to true to test helping behavior
    injured_agent_percentage: 0.2  # 20% of agents are injured/slow
    injured_walking_speed: 0.5  # m/s (normal is ~1.34 m/s)
    normal_walking_speed: 1.34  # m/s (default walking speed for healthy agents)
    assisted_speed: 0.8  # m/s (speed when helper and injured travel together)
    approach_distance: 1.5  # meters (distance threshold to transition from approaching to traveling)
    observation_radius: 20.0  # meters (distance agents can observe injured/helping behavior)
    help_duration: 600.0  # Seconds helper stays with injured agent
    description: "Test personality-driven helping. Some agents are injured/slow. Helpers (ENFJ/ESFJ) may stop to assist."
# LLM configuration
# Note: Credentials are loaded from .env file (AZURE_LLM_ENDPOINT, AZURE_LLM_API_KEY, AZURE_LLM_MODEL)
llm:
  # Temperature for sampling (0.0 = deterministic, 2.0 = very random)
  temperature: 0.7

  # Maximum retry attempts for failed API calls
  max_retries: 3

  # Maximum completion tokens for LLM responses
  max_completion_tokens: 8000

  # Embedder model for memory retrieval
  embedder: "sentence-transformers/all-mpnet-base-v2"

# Output configuration
output:
  directory: "scenarios/station_concordia/output"
  agent_decisions: "agent_decisions.json"
  events: "events.json"
  statistics: "statistics.json"

station:
  # Human-readable labels for zone/level IDs — used in agent observations and memories.
  # Keys are XML geometry IDs; values are the natural-language descriptions shown to agents.
  zone_labels:
    level_-1: "the underground platform level"
    level_-2: "the lower underground level"
    level_1:  "the upper concourse level"
    platform_1: "Platform 1"
    platform_2: "Platform 2"
    platform_3: "Platform 3"
    platform_4: "Platform 4"
    concourse:  "the concourse"
    platform_abc: "the platform near Escalators A, B and C"
    platform_def: "the platform near Escalators D, E and F"

  # UP escalators reachable from each platform zone (used for commuter valid-exits prompt).
  platform_up_exits:
    platform_abc:
      - escalator_b_up
      - escalator_c_up
    platform_def:
      - escalator_e_up
      - escalator_f_up

  # Street-level exits on level 0 (used for commuter valid-exits prompt on concourse).
  street_exits:
    - blackett_street
    - grey_street
    - eldon_square

  # Fallback zone when an agent's zone cannot be determined from spawn position.
  default_platform_zone: "platform_def"

  # Rules for assigning initial_zone from spawn coordinates.
  # Each level lists named zones with coordinate conditions (x_lt, x_gt, y_lt, y_gt).
  # Zones without conditions and with default: true are used as a catch-all.
  zone_boundaries:
    "-1":
      platform_abc:
        x_lt: -15
        y_gt: 30
      platform_def:
        default: true
    "0":
      concourse:
        default: true

  knowledge:
    base_memories:
      - "I am inside Monument station in central Newcastle."
      - "This is a multi-level station - platforms are below, concourse is above."
      - "Street exits are reached from the concourse level, not directly from platforms."
      - "Public announcements, signs, and nearby passenger behavior are useful for route decisions."

    profiles:
      novice:
        - "This is one of my first times in this station and I do not know all routes by memory."
        - "I rely heavily on signs and follow-wayfinding when choosing where to go next."
        - "If the situation is unclear, I prefer to pause briefly and gather more local information."
      commuter:
        - "I use this station often and know the general layout."
        - "I know that UP escalators on my platform lead to the concourse, but I always use the nearest one visible to me."
        - "I navigate by what I can see around me, using my general knowledge to help interpret signs and exits."

    location_memories:
      - when:
          profiles: ["commuter"]
          level_ids: ["-1"]
          zones: ["platform_abc"]
        memories:
          - "On this platform, Escalator B (going up) and Escalator C (going up) lead to the concourse and street exits."
          - "Escalator A goes down and does not lead toward the street exits."
      - when:
          profiles: ["commuter"]
          level_ids: ["-1"]
          zones: ["platform_def"]
        memories:
          - "On this platform, Escalator E (going up) and Escalator F (going up) lead to the concourse and street exits."
          - "Escalator D goes down and does not lead toward the street exits."
      - when:
          profiles: ["novice"]
          level_ids: ["-1"]
          zones: ["platform_abc", "platform_def"]
        memories:
          - "From platform level, I should look for escalators marked UP in my immediate surroundings to reach the concourse exits."
      - when:
          level_ids: ["0"]
          zones: ["concourse"]
        memories:
          - "I am on the concourse level. Street exits from here are: Blackett Street, Grey Street, and Eldon Square."
          - "From the concourse, these street exits are the final routes out of the station to street level."
          - "To reach Platforms 3 and 4, I use 'Escalator A (down to Platforms 3 & 4)'."
          - "To reach Platforms 1 and 2, I use 'Escalator D (down to Platforms 1 & 2)'."

# Video generation configuration
video:
  # Enable position tracking during simulation for video generation
  enabled: true  # Set to true to track positions (adds small overhead)
  fps: 20  # Frames per second for output video
  speedup: 1.0  # Speed multiplier (1.0 = real-time, 2.0 = 2x speed)
  dpi: 100  # Resolution (higher = better quality but larger file)
  html_log: "simulation_log.html"

# Performance optimization
performance:
  # Enable batch processing of LLM calls
  batch_processing: true

  # Cooldown between LLM queries per agent (seconds)
  agent_cooldown: 10.0

  # Cache similar decisions
  decision_caching: true

  # Maximum agents to process in parallel
  max_parallel_agents: 10
